<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Craig</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100;200;300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ── HOMEPAGE ── */
    .background-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: 0; background: #2a2a2a;
    }
    .background-container video {
      width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.1);
    }
    .content-overlay {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .text-container { text-align: center; padding: 60px 80px; }
    .text-container h1 {
      font-size: 2.5rem; font-weight: 350;
      margin-bottom: 10px; color: #fff; letter-spacing: 8px;
    }
    .subtitle {
      font-size: 1rem; font-weight: lighter;
      margin-bottom: 30px; color: #fff;
    }
    .nav-links { display: flex; gap: 30px; justify-content: center; }
    .nav-links button {
      background: none; border: none; color: #fff; cursor: pointer;
      font-size: 0.9rem; font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px; transition: opacity 0.3s;
    }
    .nav-links button:hover { opacity: 0.6; }

    /* ── SMALL MODALS ── */
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 2000;
    }
    .modal-content {
      background: rgba(255,255,255,0.96);
      padding: 15px 25px; max-width: 300px; width: 90%;
      position: relative; text-align: center;
    }
    .modal-content p {
      margin-bottom: 5px; font-weight: lighter;
      font-size: 0.75rem; color: #1a1a1a;
    }
    .modal-content a { color: #1a1a1a; text-decoration: none; }
    .modal-content a:hover { opacity: 0.8; }
    /* close via clicking backdrop only — no X button */
    .location-info { margin-top: 20px; }

    /* ── WORK MODAL ── */
    #modal-work {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff;
      z-index: 1000; overflow-y: auto;
    }

    /* Overlay that fades over the grid when a project is hovered */
    #grid-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.82);
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 40;
    }
    #grid-overlay.active { opacity: 1; }

    #close-work {
      position: fixed; top: 22px; right: 28px;
      background: none; border: none;
      color: rgba(0,0,0,0.22);
      font-size: 0.6rem; font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px; cursor: pointer;
      z-index: 1010; transition: color 0.3s; text-transform: lowercase;
    }
    #close-work:hover { color: rgba(0,0,0,0.55); }

    #moodboard-canvas { position: relative; width: 100%; background: #fff; }

    .mood-item {
      position: absolute;
      overflow: hidden;
      background: #f0f0f0;
      transition:
        opacity 0.5s ease,
        left   0.7s cubic-bezier(0.25,0.46,0.45,0.94),
        top    0.7s cubic-bezier(0.25,0.46,0.45,0.94),
        width  0.7s cubic-bezier(0.25,0.46,0.45,0.94),
        height 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .mood-item img, .mood-item video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .mood-item.contain img {
      object-fit: contain;
      background: transparent;
    }
    .mood-item.faded { opacity: 0.05; }
    .mood-item.highlighted { opacity: 1; z-index: 50 !important; }

    /* Project list — bottom left */
    #project-list {
      position: fixed; bottom: 28px; left: 28px;
      z-index: 1005;
    }
    .proj-item { margin-bottom: 5px; }
    .proj-name {
      display: block;
      color: rgba(255,255,255,0.5);
      font-size: 0.6rem; font-weight: 300;
      letter-spacing: 2.5px;
      font-family: 'Work Sans', sans-serif;
      cursor: pointer; transition: color 0.3s;
    }
    .proj-name:hover, .proj-name.active { color: rgba(255,255,255,0.95); }

    /* Credit — bottom centre */
    #work-credit {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: rgba(0,0,0,0.75);
      font-size: 0.65rem; letter-spacing: 3px; font-weight: 300;
      font-family: 'Work Sans', sans-serif;
      opacity: 0; transition: opacity 0.4s;
      pointer-events: none; white-space: nowrap;
      z-index: 1005;
    }
    #work-credit.visible { opacity: 1; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .text-container { padding: 40px 30px; width: 90%; }
      .text-container h1 { font-size: 2rem; }
      .nav-links { flex-direction: column; gap: 15px; }
      .modal-content { padding: 25px; width: 95%; }
      .modal-content p { margin-bottom: 12px; }

      #modal-work { overflow-y: auto; background: #fff !important; }
      #close-work { top: 14px; right: 14px; font-size: 0.55rem; }

      /* Two-column grid */
      #moodboard-canvas {
        position: relative !important;
        height: auto !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        padding: 50px 0 80px;
        background: #fff !important;
      }
      .mood-item {
        position: relative !important;
        left: auto !important; top: auto !important;
        width: 100% !important; height: auto !important;
        transform: none !important;
        opacity: 1 !important;
        transition: opacity 0.3s ease !important;
        cursor: pointer;
      }
      .mood-item img, .mood-item video {
        width: 100%; height: auto; object-fit: unset; display: block;
      }
      /* Hide non-grid items on mobile grid */
      .mood-item.mobile-hidden { display: none !important; }

      /* Project list hidden on mobile — navigation is via image taps */
      #project-list { display: none; }

      /* Grid overlay on mobile */
      #grid-overlay { background: rgba(255,255,255,0.92); }

      /* Mobile project overlay */
      #mobile-project-overlay {
        display: none;
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: #fff;
        z-index: 2000;
        overflow-y: auto;
        padding: 50px 12px 100px;
        box-sizing: border-box;
      }
      #mobile-project-overlay.active { display: block; }
      #mobile-close-btn {
        position: fixed; top: 14px; right: 16px;
        background: none; border: none;
        color: rgba(0,0,0,0.3);
        font-size: 0.55rem; font-family: 'Work Sans', sans-serif;
        letter-spacing: 3px; cursor: pointer; z-index: 2010;
        text-transform: lowercase;
      }
      #mobile-project-images {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #mobile-project-images img,
      #mobile-project-images video {
        width: 100%; height: auto; display: block;
      }
      #mobile-project-credit {
        margin-top: 18px;
        color: rgba(0,0,0,0.6);
        font-size: 0.55rem;
        letter-spacing: 3px;
        font-weight: 300;
        font-family: 'Work Sans', sans-serif;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="background-container">
    <video autoplay muted loop playsinline preload="auto">
      <source src="video1.mov" type="video/mp4">
      <source src="video1.MOV" type="video/mp4">
    </video>
  </div>

  <div class="content-overlay">
    <div class="text-container">
      <h1>AnnaCraig</h1>
      <div class="nav-links">
        <button id="open-about">about</button>
        <button id="open-work">work</button>
        <button id="open-contact">contact</button>
      </div>
    </div>
  </div>

  <div id="modal-about" class="modal">
    <div class="modal-content">
      <p>Visual artist and art director working across photography, set styling and installation</p>
      <div class="location-info">
        <p>b. 1995</p>
        <p>Based in St Leonards-on-Sea / London</p>
      </div>
    </div>
  </div>

  <div id="modal-contact" class="modal">
    <div class="modal-content">
      <p><a href="mailto:acshapes@gmail.com">acshapes@gmail.com</a></p>
      <p><a href="https://www.instagram.com/acshapes/" target="_blank">@acshapes</a></p>
    </div>
  </div>

  <div id="modal-work">
    <button id="close-work">close</button>
    <div id="grid-overlay"></div>
    <div id="moodboard-canvas"></div>
    <div id="project-list"></div>
    <div id="work-credit"></div>
  </div>

  <!-- Mobile project overlay -->
  <div id="mobile-project-overlay">
    <button id="mobile-close-btn">close</button>
    <div id="mobile-project-images"></div>
    <div id="mobile-project-credit"></div>
  </div>

  <script>
    document.getElementById('open-about').onclick  = () => { document.getElementById('modal-about').style.display  = 'flex'; };
    document.getElementById('open-contact').onclick = () => { document.getElementById('modal-contact').style.display = 'flex'; };
    document.querySelectorAll('.close').forEach(btn => {
      btn.onclick = () => { document.getElementById(btn.dataset.close).style.display = 'none'; };
    });
    // Close modals on click or touch of backdrop (works on mobile and desktop)
    ['click', 'touchend'].forEach(evt => {
      window.addEventListener(evt, e => {
        if (e.target.classList.contains('modal')) {
          e.preventDefault();
          e.target.style.display = 'none';
        }
      });
    });

    const projects = [
      { id: 'notinservice', name: 'Not In Service',             client: 'Six Dots Design',         credit: 'Solo Creative Direction & Production'  },
      { id: 'folly',        name: 'A Folly Through The Trees',  client: 'Six Dots Design',         credit: 'Fabric Installation & Spatial Design'  },
      { id: 'balancing',    name: 'Balancing Art',              client: 'Six Dots Design',         credit: 'Photography & Creative Direction'       },
      { id: 'lifestyle',    name: 'Lifestyle',                  client: 'Six Dots Design',         credit: 'Photography & Creative Direction'       },
      { id: 'carousel',     name: 'Retail Window Installation', client: 'Carousel Jewels',         credit: 'Concept, Design & Installation'         },
      { id: 'film',         name: 'In His Name',                client: 'Lemon Top Pictures',      credit: 'Costume Design & Styling'              },
      { id: 'sol',          name: 'Sol Paradise',               client: 'Just Jump In Production', credit: 'Styling & Production Assistant'         },
      { id: 'starta',       name: 'The Aztek Shirt',            client: 'st arta',                 credit: 'Styling & Location Research'            },
      { id: 'product',      name: 'Product Shots',              client: 'Six Dots Design',         credit: 'Photography & Creative Direction'       },
    ];

    // All images — used for project hover clusters
    const allItems = [
      { file: 'notinservice1.jpeg', project: 'notinservice', aspect: 0.75,  gridOnly: true },
      { file: 'notinservice.mov',   project: 'notinservice', aspect: 1.78,  video: true    },
      { file: 'folly2.jpeg',        project: 'folly',        aspect: 0.75,  gridOnly: true },
      { file: 'folly1.jpeg',        project: 'folly',        aspect: 0.75        },
      { file: 'folly4.jpeg',        project: 'folly',        aspect: 1.5         },
      { file: 'balancing1.jpeg',    project: 'balancing',    aspect: 0.75,  gridOnly: true },
      { file: 'balancing2.jpeg',    project: 'balancing',    aspect: 0.75,  gridOnly: true },
      { file: 'balancing3.jpeg',    project: 'balancing',    aspect: 1.5         },
      { file: 'balancing4.jpeg',    project: 'balancing',    aspect: 1.0         },
      { file: 'lifestyle1.jpeg',    project: 'lifestyle',    aspect: 0.75        },
      { file: 'lifestyle3.jpeg',    project: 'lifestyle',    aspect: 1.5         },
      { file: 'carousel1.jpeg',     project: 'carousel',     aspect: 0.75        },
      { file: 'carousel2.jpeg',     project: 'carousel',     aspect: 0.75        },
      { file: 'inhisname1.jpeg',    project: 'film',         aspect: 0.75        },
      { file: 'inhisname2.jpeg',    project: 'film',         aspect: 1.5         },
      { file: 'sol1.jpeg',          project: 'sol',          aspect: 0.75        },
      { file: 'sol3.jpeg',          project: 'sol',          aspect: 1.5         },
      { file: 'starta1.jpeg',       project: 'starta',       aspect: 1.78        },
      { file: 'product1.jpeg',      project: 'product',      aspect: 0.75        },
    ];

    // Curated 12 shown in the grid, in this exact order
    const gridFiles = [
      'notinservice1.jpeg',
      'folly2.jpeg',
      'balancing1.jpeg',
      'lifestyle1.jpeg',
      'carousel1.jpeg',
      'inhisname1.jpeg',
      'sol1.jpeg',
      'starta1.jpeg',
      'product1.jpeg',
      'balancing2.jpeg',
    ];

    const mobileGridFiles = [
      'notinservice1.jpeg',
      'folly2.jpeg',
      'balancing1.jpeg',
      'lifestyle1.jpeg',
      'inhisname1.jpeg',
      'sol1.jpeg',
      'starta1.jpeg',
      'product1.jpeg',
      'carousel1.jpeg',
    ];

    const items = allItems;

    const canvas     = document.getElementById('moodboard-canvas');
    const projListEl = document.getElementById('project-list');
    const creditEl   = document.getElementById('work-credit');

    const domItems = items.map((item, i) => {
      const el = document.createElement('div');
      el.className = 'mood-item';
      el.dataset.project  = item.project;
      el.dataset.index    = i;
      el.dataset.aspect   = item.aspect;
      el.dataset.gridOnly = item.gridOnly ? 'true' : 'false';

      if (item.video) {
        const v = document.createElement('video');
        // notinservice video plays with sound in project view
        v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
        v.setAttribute('loop', '');
        v.dataset.projectVideo = 'true';
        // Try both MIME types for .mov compatibility across browsers
        ['video/mp4', 'video/quicktime'].forEach(type => {
          const s = document.createElement('source');
          s.src = item.file; s.type = type;
          v.appendChild(s);
        });
        el.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = item.file; img.alt = ''; img.loading = 'lazy';
        el.appendChild(img);
      }

      canvas.appendChild(el);
      return el;
    });

    // ── Mobile: mark non-grid items as hidden in the grid ────────────────
    function setupMobileGrid() {
      domItems.forEach(el => {
        const file = allItems[parseInt(el.dataset.index)].file;
        el.classList.toggle('mobile-hidden', !mobileGridFiles.includes(file));
      });
      // Reorder items visually to match mobileGridFiles order
      const canvas = document.getElementById('moodboard-canvas');
      mobileGridFiles.forEach((file, i) => {
        const idx = allItems.findIndex(it => it.file === file);
        if (idx !== -1) domItems[idx].style.order = i;
      });
    }
    if (isMobile()) setupMobileGrid();

    // ── Mobile project overlay ─────────────────────────────────────────────
    function showMobileProject(pid) {
      activeProject = pid;
      const proj    = projects.find(p => p.id === pid);
      const overlay = document.getElementById('mobile-project-overlay');
      const imgWrap = document.getElementById('mobile-project-images');
      const credit  = document.getElementById('mobile-project-credit');

      imgWrap.innerHTML = '';

      // Get all non-gridOnly items for this project
      allItems.forEach(item => {
        if (item.project !== pid || item.gridOnly) return;
        if (item.video) {
          const v = document.createElement('video');
          v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
          v.setAttribute('loop', '');
          ['video/mp4', 'video/quicktime'].forEach(type => {
            const s = document.createElement('source');
            s.src = item.file; s.type = type;
            v.appendChild(s);
          });
          imgWrap.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = item.file; img.alt = ''; img.loading = 'lazy';
          imgWrap.appendChild(img);
        }
      });

      if (proj) {
        credit.textContent = proj.credit + ' — ' + proj.client;
      }

      overlay.classList.add('active');
      overlay.scrollTop = 0;
    }

    function hideMobileProject() {
      activeProject = null;
      document.getElementById('mobile-project-overlay').classList.remove('active');
    }

    document.getElementById('mobile-close-btn').addEventListener('click', hideMobileProject);

    projects.forEach(proj => {
      const d = document.createElement('div');
      d.className = 'proj-item';
      const s = document.createElement('span');
      s.className = 'proj-name';
      s.dataset.project = proj.id;
      s.textContent = proj.name;
      d.appendChild(s);
      projListEl.appendChild(d);
    });

    const origPos = [];

    function isMobile() { return window.innerWidth <= 768; }

    function interleaveByProject(arr) {
      const byProject = {};
      arr.forEach((item, i) => {
        if (!byProject[item.project]) byProject[item.project] = [];
        byProject[item.project].push({ item, origIndex: i });
      });
      const queues = Object.values(byProject);
      const result = [];
      let safety = 0;
      while (result.length < arr.length && safety++ < 10000) {
        queues.forEach(q => { if (q.length) result.push(q.shift()); });
      }
      return result;
    }

    function layoutDesktop() {
      if (isMobile()) return;
      const W       = canvas.clientWidth;
      const numCols = 5;
      const gap     = 12;
      const padTop  = 55;
      const padSide = 22;
      const colW    = (W - padSide * 2 - gap * (numCols - 1)) / numCols;
      const colH    = new Array(numCols).fill(padTop);

      // Hide all items first
      domItems.forEach(el => {
        el.style.opacity      = '0';
        el.style.pointerEvents = 'none';
      });

      // Layout only the curated grid items in fixed order
      gridFiles.forEach(file => {
        const idx = allItems.findIndex(it => it.file === file);
        if (idx === -1) return;
        const item = allItems[idx];
        const el   = domItems[idx];
        const imgW = colW;
        const imgH = imgW / item.aspect;

        let minC = 0;
        for (let c = 1; c < numCols; c++) {
          if (colH[c] < colH[minC]) minC = c;
        }

        const x = padSide + minC * (colW + gap);
        const y = colH[minC];

        el.style.left          = x + 'px';
        el.style.top           = y + 'px';
        el.style.width         = imgW + 'px';
        el.style.height        = imgH + 'px';
        el.style.transform     = 'none';
        el.style.zIndex        = idx + 1;
        el.style.opacity       = '1';
        el.style.pointerEvents = 'auto';

        origPos[idx] = { x, y, w: imgW, h: imgH, inGrid: true };
        colH[minC] += imgH + gap;
      });

      canvas.style.height = Math.max(...colH) + 60 + 'px';
    }

    function clusterLayout(projEls, pid) {
      const vw   = window.innerWidth;
      const vh   = window.innerHeight;
      const padX = 50;
      const padY = 60;
      const gap  = 28;
      const availW = vw - padX * 2;
      const availH = vh - padY * 2;

      function resolveLayout(slots) {
        const bboxW = Math.max(...slots.map(s => s.x + s.w));
        const bboxH = Math.max(...slots.map(s => s.y + s.h));
        const scale  = Math.min(availW / bboxW, availH / bboxH);
        const totalW = bboxW * scale;
        const totalH = bboxH * scale;
        const offX   = (vw - totalW) / 2;
        const offY   = (vh - totalH) / 2;
        return slots.map(s => ({
          x: offX + s.x * scale,
          y: offY + s.y * scale,
          w: s.w * scale,
          h: s.h * scale,
        }));
      }

      // NOT IN SERVICE: video only, moderate size centred
      if (pid === 'notinservice') {
        const vidW = 700; const vidH = vidW / 1.78;
        return resolveLayout([{ x: 0, y: 0, w: vidW, h: vidH }]);
      }

      // FOLLY: folly1 portrait left, folly4 landscape right — vertically centred
      // projEls order in allItems: folly1, folly4
      if (pid === 'folly') {
        const pW = 300; const pH = pW / 0.75;
        const lW = 540; const lH = lW / 1.5;
        const totalH = Math.max(pH, lH);
        return resolveLayout([
          { x: 0,          y: (totalH - pH) / 2, w: pW, h: pH },
          { x: pW + gap,   y: (totalH - lH) / 2, w: lW, h: lH },
        ]);
      }

      // BALANCING: balancing3 landscape fully uncropped, balancing4 square beside
      // Use object-fit: contain on balancing3 to never crop
      if (pid === 'balancing') {
        const lW = 640; const lH = lW / 1.5;
        const sW = 300; const sH = sW;
        const totalH = Math.max(lH, sH);
        return resolveLayout([
          { x: 0,        y: (totalH - lH) / 2, w: lW, h: lH },
          { x: lW + gap, y: (totalH - sH) / 2, w: sW, h: sH },
        ]);
      }

      // LIFESTYLE: lifestyle1 portrait left, lifestyle3 landscape right
      if (pid === 'lifestyle') {
        const pW = 300; const pH = pW / 0.75;
        const lW = 520; const lH = lW / 1.5;
        const totalH = Math.max(pH, lH);
        return resolveLayout([
          { x: 0,        y: (totalH - pH) / 2, w: pW, h: pH },
          { x: pW + gap, y: (totalH - lH) / 2, w: lW, h: lH },
        ]);
      }

      // CAROUSEL: two portraits side by side
      if (pid === 'carousel') {
        const pW = 320; const pH = pW / 0.75;
        return resolveLayout([
          { x: 0,        y: 0, w: pW, h: pH },
          { x: pW + gap, y: 0, w: pW, h: pH },
        ]);
      }

      // IN HIS NAME: portrait large left, landscape right slightly smaller
      if (pid === 'film') {
        const pW = 380; const pH = pW / 0.75;
        const lW = 380; const lH = lW / 1.5;
        return resolveLayout([
          { x: 0,        y: 0,             w: pW, h: pH },
          { x: pW + gap, y: (pH - lH) / 2, w: lW, h: lH },
        ]);
      }

      // SOL: sol1 portrait left, sol3 landscape right
      if (pid === 'sol') {
        const pW = 320; const pH = pW / 0.75;
        const lW = 500; const lH = lW / 1.5;
        const totalH = Math.max(pH, lH);
        return resolveLayout([
          { x: 0,        y: (totalH - pH) / 2, w: pW, h: pH },
          { x: pW + gap, y: (totalH - lH) / 2, w: lW, h: lH },
        ]);
      }

      // DEFAULT: single row
      const n = projEls.length;
      const imgW = (availW - gap * (n - 1)) / n;
      let slots = []; let xOff = 0;
      projEls.forEach(el => {
        const a = parseFloat(el.dataset.aspect) || 1;
        slots.push({ x: xOff, y: 0, w: imgW, h: imgW / a });
        xOff += imgW + gap;
      });
      return resolveLayout(slots);
    }

    function resetMoodboard() {
      domItems.forEach((el, i) => {
        el.classList.remove('faded', 'highlighted', 'contain');
        if (!isMobile()) {
          if (origPos[i] && origPos[i].inGrid) {
            const p = origPos[i];
            el.style.left          = p.x + 'px';
            el.style.top           = p.y + 'px';
            el.style.width         = p.w + 'px';
            el.style.height        = p.h + 'px';
            el.style.zIndex        = i + 1;
            el.style.opacity       = '1';
            el.style.pointerEvents = 'auto';
          } else {
            // Not in grid — hide again
            el.style.opacity       = '0';
            el.style.pointerEvents = 'none';
          }
        }
      });
      creditEl.classList.remove('visible');
      creditEl.textContent = '';
    }

    // ── Shared function: activate a project cluster ─────────────────────
    let activeProject = null; // tracks click-locked project

    function showProject(pid) {
      const proj    = projects.find(p => p.id === pid);
      const projEls = domItems.filter(el => el.dataset.project === pid && el.dataset.gridOnly !== 'true');

      document.getElementById('grid-overlay').classList.add('active');

      domItems.forEach(el => {
        if (el.dataset.project === pid) {
          el.classList.add('highlighted'); el.classList.remove('faded');
          el.style.opacity = '1'; el.style.pointerEvents = 'auto';
          const v = el.querySelector('video'); if (v) v.muted = false;
          // balancing3 should never be cropped
          const src = el.querySelector('img') ? el.querySelector('img').src : '';
          if (src.includes('balancing3')) el.classList.add('contain');
        } else {
          el.classList.add('faded'); el.classList.remove('highlighted');
          const v = el.querySelector('video'); if (v) v.muted = true;
        }
      });

      const layout = clusterLayout(projEls, pid);
      projEls.forEach((el, i) => {
        const L = layout[i];
        el.style.left = L.x + 'px'; el.style.top = L.y + 'px';
        el.style.width = L.w + 'px'; el.style.height = L.h + 'px';
        el.style.zIndex = 60 + i;
      });

      // Highlight matching proj-name in list
      document.querySelectorAll('.proj-name').forEach(n => {
        n.classList.toggle('active', n.dataset.project === pid);
      });

      if (proj) {
        creditEl.textContent = `${proj.credit} — ${proj.client}`;
        creditEl.classList.add('visible');
      }
    }

    function hideProject() {
      activeProject = null;
      document.getElementById('grid-overlay').classList.remove('active');
      domItems.forEach(el => { const v = el.querySelector('video'); if (v) v.muted = true; });
      document.querySelectorAll('.proj-name').forEach(n => n.classList.remove('active'));
      resetMoodboard();
    }

    // ── Wire up grid image clicks ─────────────────────────────────────────
    domItems.forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const pid = el.dataset.project;
        if (isMobile()) {
          // mobile: toggle project overlay
          if (activeProject === pid) { hideMobileProject(); return; }
          showMobileProject(pid);
          return;
        }
        if (activeProject === pid) { hideProject(); return; }
        activeProject = pid;
        showProject(pid);
      });
    });

    // Click anywhere on the work modal (not on image/project-name) closes
    document.getElementById('modal-work').addEventListener('click', (e) => {
      if (activeProject) {
        if (isMobile()) hideMobileProject();
        else hideProject();
      }
    });

    // ── Project name list: hover previews, click locks ────────────────────
    document.querySelectorAll('.proj-name').forEach(nameEl => {
      const pid  = nameEl.dataset.project;

      nameEl.addEventListener('mouseenter', () => {
        if (isMobile() || activeProject) return;
        showProject(pid);
      });

      nameEl.addEventListener('mouseleave', () => {
        if (isMobile() || activeProject) return;
        document.getElementById('grid-overlay').classList.remove('active');
        domItems.forEach(el => { const v = el.querySelector('video'); if (v) v.muted = true; });
        resetMoodboard();
      });

      nameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isMobile()) {
          if (activeProject === pid) { hideMobileProject(); return; }
          showMobileProject(pid);
          return;
        }
        if (activeProject === pid) {
          hideProject();
        } else {
          activeProject = pid;
          showProject(pid);
        }
      });

      // mobile nav via image taps — handled in domItems click listener
    });

    document.getElementById('open-work').onclick = () => {
      document.getElementById('modal-work').style.display = 'block';
      if (isMobile()) setupMobileGrid();
      else setTimeout(layoutDesktop, 60);
    };

    document.getElementById('close-work').onclick = () => {
      document.getElementById('modal-work').style.display = 'none';
      resetMoodboard();
      document.querySelectorAll('.proj-name').forEach(n => n.classList.remove('active'));
    };

    window.addEventListener('resize', () => {
      if (isMobile()) {
        setupMobileGrid();
      } else if (document.getElementById('modal-work').style.display === 'block') {
        origPos.length = 0;
        layoutDesktop();
      }
    });
  </script>
</body>
</html>

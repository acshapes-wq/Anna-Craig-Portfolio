<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Craig</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100;200;300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ── HOMEPAGE ── */
    .background-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: 0; background: #2a2a2a;
    }
    .background-container video {
      width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.1);
    }
    .content-overlay {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .text-container { text-align: center; padding: 60px 80px; }
    .text-container h1 {
      font-size: 2.5rem; font-weight: 350;
      margin-bottom: 10px; color: #fff; letter-spacing: 8px;
    }
    .subtitle {
      font-size: 1rem; font-weight: lighter;
      margin-bottom: 30px; color: #fff;
    }
    .nav-links { display: flex; gap: 30px; justify-content: center; }
    .nav-links button {
      background: none; border: none; color: #fff; cursor: pointer;
      font-size: 0.9rem; font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px; transition: opacity 0.3s;
    }
    .nav-links button:hover { opacity: 0.6; }

    /* ── PERMANENT ABOUT / CONTACT INFO (top left over hero video) ── */
    .hero-info {
      position: fixed;
      top: 28px; left: 28px;
      z-index: 2;
      max-width: 260px;
      color: rgba(255,255,255,0.85);
    }
    .hero-info p {
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }
    .hero-info .hero-tagline {
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #fff;
    }
    .hero-info .hero-meta {
      margin-top: 14px;
      color: rgba(255,255,255,0.6);
    }
    .hero-info a {
      display: block;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      transition: opacity 0.3s;
    }
    .hero-info a:hover { opacity: 0.6; }
    .hero-info .hero-links { margin-top: 14px; }

    /* ── PERMANENT INFO USES ITS OWN STYLES ABOVE; small modal styles removed ── */

    #modal-work {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff;
      z-index: 1000; overflow: hidden;
    }

    #close-work {
      position: fixed; top: 22px; right: 28px;
      background: none; border: none;
      color: rgba(0,0,0,0.22);
      font-size: 0.6rem; font-family: 'Work Sans', sans-serif;
      letter-spacing: 3px; cursor: pointer;
      z-index: 1010; transition: color 0.3s; text-transform: lowercase;
    }
    #close-work:hover { color: rgba(0,0,0,0.55); }

    .slideshow-wrap {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 30px 24px 30px 60px;
      position: relative;
      overflow: hidden;
    }

    .slide-count {
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 2.5px;
      color: rgba(0,0,0,0.3);
      margin-bottom: 12px;
      text-transform: lowercase;
    }

    .slide-media {
      position: relative;
      height: 56vh;
      aspect-ratio: 4 / 5;
    }

    .slide-image-frame {
      width: 100%;
      height: 100%;
      background: #f4f4f2;
      border: 1px dashed rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .slide-image-frame img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .slide-placeholder-text {
      font-size: 0.55rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: rgba(0,0,0,0.3);
      text-align: center;
      padding: 20px;
      text-transform: lowercase;
    }

    .slide-next-btn {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #1a1a1a;
      font-size: 0.8rem;
      transition: background 0.3s;
      z-index: 5;
    }
    .slide-next-btn:hover { background: #fff; }

    .slide-description {
      max-width: 460px;
      width: 100%;
      margin-top: 16px;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: rgba(0,0,0,0.55);
      text-align: left;
    }

    #commercial-link {
      position: fixed;
      bottom: 22px; left: 28px;
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #1a1a1a;
      text-decoration: none;
      text-transform: lowercase;
      z-index: 1005;
      padding-bottom: 1px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    #commercial-link:hover { border-bottom-color: #1a1a1a; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .text-container { padding: 40px 30px; width: 90%; }
      .text-container h1 { font-size: 2rem; }
      .nav-links { flex-direction: column; gap: 15px; }
      .hero-info { top: 18px; left: 18px; max-width: 200px; }
      .hero-info p, .hero-info a { font-size: 0.48rem; }
      .hero-info .hero-tagline { font-size: 0.52rem; }
      .modal-content { padding: 25px; width: 95%; }
      .modal-content p { margin-bottom: 12px; }

      #modal-work { overflow-y: auto; background: #fff !important; }
      #close-work { top: 14px; right: 14px; font-size: 0.55rem; }

      .slideshow-wrap { padding: 60px 20px 20px; align-items: center; }
      .slide-media { height: 46vh; }
      .slide-description { max-width: 100%; }
      #commercial-link { bottom: 18px; left: 18px; }
    }
  </style>
</head>
<body>

  <div class="background-container">
    <video autoplay muted loop playsinline preload="auto">
      <source src="video1.mov" type="video/mp4">
      <source src="video1.MOV" type="video/mp4">
    </video>
  </div>

  <div class="hero-info">
    <p class="hero-tagline">Visual artist and art director</p>
    <p>Working across concept, styling and installation, with a studio practice in painting, natural pigment and ceramics.</p>
    <div class="hero-meta">
      <p>b. 1995</p>
      <p>Based in St Leonards-on-Sea / London</p>
    </div>
    <div class="hero-links">
      <a href="mailto:acshapes@gmail.com">acshapes@gmail.com</a>
      <a href="https://www.instagram.com/acshapes/" target="_blank">@acshapes</a>
    </div>
  </div>

  <div class="content-overlay">
    <div class="text-container">
      <h1>AnnaCraig</h1>
      <div class="nav-links">
        <button id="open-work">work</button>
      </div>
    </div>
  </div>

  <div id="modal-work">
    <button id="close-work">close</button>

    <div class="slideshow-wrap">
      <div class="slide-count" id="slide-count"></div>

      <div class="slide-media">
        <div class="slide-image-frame" id="slide-image-frame">
          <!-- image or placeholder injected by JS -->
        </div>
        <button class="slide-next-btn" id="slide-next-btn" aria-label="Next image">&#8594;</button>
      </div>

      <div class="slide-description" id="slide-description"></div>
    </div>

    <a id="commercial-link" href="commercial-work.html">commercial work</a>
  </div>

  <script>
    // About and contact are now permanent on-screen text (see .hero-info) — no popup JS needed.

    // ── SELECTED WORKS SLIDESHOW ─────────────────────────────────────────
    // Fill in `file` with the real image filename once ready (e.g. 'work1.jpg'),
    // and write the real caption in `description`. Leaving `file` empty shows
    // a placeholder box so you can see the layout before the photos exist.
    const slides = [
      { file: '', description: 'Add description for image 1' },
      { file: '', description: 'Add description for image 2' },
      { file: '', description: 'Add description for image 3' },
      { file: '', description: 'Add description for image 4' },
      { file: '', description: 'Add description for image 5' },
      { file: '', description: 'Add description for image 6' },
      { file: '', description: 'Add description for image 7' },
      { file: '', description: 'Add description for image 8' },
    ];

    let currentSlide = 0;
    const frameEl = document.getElementById('slide-image-frame');
    const descEl  = document.getElementById('slide-description');
    const countEl = document.getElementById('slide-count');

    function renderSlide() {
      const slide = slides[currentSlide];
      frameEl.innerHTML = '';

      if (slide.file) {
        const img = document.createElement('img');
        img.src = slide.file;
        img.alt = slide.description || '';
        frameEl.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'slide-placeholder-text';
        placeholder.textContent = 'image ' + (currentSlide + 1) + ' — add file to slides array';
        frameEl.appendChild(placeholder);
      }

      descEl.textContent = slide.description || '';
      countEl.textContent = (currentSlide + 1) + ' / ' + slides.length;
    }

    document.getElementById('slide-next-btn').addEventListener('click', () => {
      currentSlide = (currentSlide + 1) % slides.length;
      renderSlide();
    });

    document.getElementById('open-work').onclick = () => {
      document.getElementById('modal-work').style.display = 'block';
      currentSlide = 0;
      renderSlide();
    };

    document.getElementById('close-work').onclick = () => {
      document.getElementById('modal-work').style.display = 'none';
    };
  </script>
</body>
</html>
